services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
      - "20000-20100:20000-20100/udp"  # WebRTC media ports
    environment:
      - NODE_ENV=production
      - BACKEND_PORT=3001
      - BACKEND_HOST=0.0.0.0
      - CORS_ORIGIN=https://midistream.duckdns.org
      - MEDIASOUP_LISTEN_IP=0.0.0.0
      - MEDIASOUP_ANNOUNCED_IP=${MEDIASOUP_ANNOUNCED_IP:-138.128.243.241}
      - MEDIASOUP_MIN_PORT=20000
      - MEDIASOUP_MAX_PORT=20100
    networks:
      - mcr-network
      - proxy_default
    restart: unless-stopped

  ndi-bridge:
    build:
      context: ./ndi-bridge
      dockerfile: Dockerfile
    environment:
      - NDI_BACKEND_URL=http://backend:3001
      - NDI_SOURCE_PREFIX=MCR-
      - NDI_MAX_STREAMS=8
      - NDI_LOG_LEVEL=INFO
      - NDI_DISCOVERY_URL=tcp://host.docker.internal:5959
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend
    networks:
      - mcr-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=https://midistream.duckdns.org
        - NEXT_PUBLIC_WS_URL=wss://midistream.duckdns.org
    environment:
      - NODE_ENV=production
    networks:
      - mcr-network
      - proxy_default

networks:
  mcr-network:
    driver: bridge
  proxy_default:
    external: true