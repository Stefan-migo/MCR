services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
      - "10000-12000:10000-12000/udp"  # WebRTC port range
    environment:
      - NODE_ENV=production
      - BACKEND_PORT=3001
      - CORS_ORIGIN=https://localhost:3000
      - MEDIASOUP_ANNOUNCED_IP=${MEDIASOUP_ANNOUNCED_IP:-${PUBLIC_IP:-192.168.0.138}}
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - mcr-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=https://${PUBLIC_IP:-192.168.0.138}:3001
        - NEXT_PUBLIC_WS_URL=wss://${PUBLIC_IP:-192.168.0.138}:3001
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - mcr-network

networks:
  mcr-network:
    driver: bridge